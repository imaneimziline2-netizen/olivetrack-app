version: "3.9"
services:
    api:
        build: .
        container_name: olivetrack-backend
        ports:
            - "5000:5000"
        env_file:
            - .env
        environment:
            - MONGO_URI=${MONGO_URL}
        depends_on:
            - mongo
        restart: unless-stopped

    mongo:
        image: mongo:6.0
        container_name: olivetrack-mongo
        ports:
            - "27017:27017"
        volumes:
            - mongo-data:/data/db
        restart: unless-stopped

volumes:
    mongo-data:
